name: Mihoyo Sign

on:
  workflow_dispatch:
  schedule:
    # 北京时间 08:15（UTC+8）
    - cron: '15 0 * * *'

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create config.yaml
        run: |
          mkdir -p config

          cat > config/config.yaml <<EOF
          enable: true
          version: 15
          push: ""

          account:
            cookie: "${{ secrets.MYS_COOKIE }}"
            stuid: ""
            stoken: "${{ secrets.MYS_STOKEN }}"
            mid: ""

          device:
            name: "Xiaomi MI 6"
            model: "Mi 6"
            id: ""
            fp: ""

          mihoyobbs:
            enable: false

          games:
            cn:
              enable: true
              useragent: "Mozilla/5.0 (Linux; Android 12; Unspecified Device) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/103.0.5060.129 Mobile Safari/537.36"
              retries: 3

              genshin:
                checkin: true
                black_list: []

              honkai2:
                checkin: false
                black_list: []

              honkai3rd:
                checkin: false
                black_list: []

              tears_of_themis:
                checkin: false
                black_list: []

              honkai_sr:
                checkin: false
                black_list: []

              zzz:
                checkin: false
                black_list: []

            os:
              enable: false

          cloud_games:
            cn:
              enable: false
            os:
              enable: false

          competition:
            enable: false

          web_activity:
            enable: false
          EOF

      - name: Create push.ini
        run: |
          cat > config/push.ini <<EOF
          [setting]
          enable=true
          push_server=smtp
          error_push_only=false

          [smtp]
          mailhost=${{ secrets.SMTP_MAILHOST }}
          port=${{ secrets.SMTP_PORT }}
          ssl_enable=${{ secrets.SMTP_SSL }}
          fromaddr=${{ secrets.SMTP_FROM }}
          toaddr=${{ secrets.SMTP_TO }}
          subject=AutoMihoyoBBS
          username=${{ secrets.SMTP_USER }}
          password=${{ secrets.SMTP_PASS }}
          background=true
          EOF

      - name: Create logging.ini
        run: |
          cat > config/logging.ini <<EOF
          [loggers]
          keys=root,AutoMihoyoBBS

          [handlers]
          keys=fileHandler,consoleHandler

          [formatters]
          keys=simpleFormatter

          [logger_root]
          level=DEBUG
          handlers=fileHandler,consoleHandler

          [logger_AutoMihoyoBBS]
          level=WARNING
          qualname=AutoMihoyoBBS
          handlers=fileHandler,consoleHandler

          [handler_consoleHandler]
          class=StreamHandler
          args=(sys.stdout,)
          level=INFO
          formatter=simpleFormatter

          [handler_fileHandler]
          class=FileHandler
          args=('logging.log','a')
          level=DEBUG
          formatter=simpleFormatter

          [formatter_simpleFormatter]
          format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
          datefmt=%Y-%m-%dT%H:%M:%S
          EOF

      - name: Run Sign
        run: |
          python main.py
